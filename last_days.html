function gameOver(motivo){
  if(!S.vivo) return;
  S.vivo = false;
  pararAudioExpedicao();
  pararAudioPrologo();
  pararTemaJogo();
  S.player.vida = 0;
  S.motivoMorte = motivo;
  S.acao = null;
  limparModais();
  sincronizarEstado();
  salvarJogo();
  clearInterval(loopId);
  log(esc(motivo), 'sangue');
  render();

  const descendentes = S.familia.membros
    .filter(m=>m.vivo && m.jogavel && m.id !== S.familia.atual)
    .filter(m=>ancestrais(m).has(S.familia.atual))
    .filter(m=>avaliarLideranca(m).apto)
    .sort((a,b)=>avaliarLideranca(b).pontuacao-avaliarLideranca(a).pontuacao);
  if(descendentes.length){
    const herdeiro = descendentes[0];
    abrirModal('FIM DE LINHA',
      `${esc(motivo)}<br><br>
       ${esc(herdeiro.nome)} tem idade e preparo suficientes para assumir a liderança.<br>
       A família pode continuar através dele(a).`,
      [{ texto:`Continuar como ${herdeiro.nome}`, fn:()=> assumirDescendente(herdeiro.id) },
       { texto:'Deixar o acampamento votar', fn:()=> abrirVotacaoSucessao() },
       { texto:'Recomeçar', fn:()=> location.reload() }]);
    return;
  }
  const dependentes = S.familia.membros
    .filter(m=>m.vivo && m.jogavel && m.id !== S.familia.atual && idadeMembro(m) < IDADE_ADULTA && ancestrais(m).has(S.familia.atual));
  if(dependentes.length){
    const dependente = dependentes[0];
    abrirModal('Uma liderança improvável',
      `${esc(dependente.nome)} ainda é jovem demais para comandar sozinho. O acampamento pode proteger a criança ou escolher outra pessoa para liderar.`,
      [{ texto:`Continuar como ${dependente.nome}`, fn:()=> assumirDescendente(dependente.id) },
       { texto:'Deixar o acampamento votar', fn:()=> abrirVotacaoSucessao() },
       { texto:'Recomeçar', fn:()=> location.reload() }]);
    return;
  }
  abrirVotacaoSucessao();
}

function avaliarLideranca(membro){
  const stats = membro.stats || {};
  const pontuacao = (stats.forca||0) + (stats.agilidade||0) +
    (stats.inteligencia||0) + (stats.resistencia||0) + (stats.carisma||0)*2;
  return { pontuacao, apto:idadeMembro(membro) >= IDADE_ADULTA && pontuacao >= 18 };
}

function abrirVotacaoSucessao(){
  const candidatos = S.sobreviventes.filter(s=>{
    if(!s.vivo) return false;
    const membro = s.familiaId ? S.familia.membros.find(m=>m.id === s.familiaId) : null;
    return !membro || idadeMembro(membro) >= IDADE_ADULTA;
  });
  if(!candidatos.length){
    abrirModal('FIM DE LINHA',
      'Nenhum adulto está em condições de liderar o acampamento.',
      [{ texto:'Recomeçar', fn:()=> location.reload() }]);
    return;
  }
  abrirModal('O acampamento decide',
    'A comunidade se reúne para escolher um adulto que possa assumir a liderança.',
    [{ texto:'Realizar votação', fn:()=>{
      const votos = candidatos.map(c=>({
        candidato:c,
        votos:Math.max(1, Math.round((c.forca ?? 2) + (c.inteligencia ?? 2) + Math.random()*6))
      })).sort((a,b)=>b.votos-a.votos);
      const eleito = votos[0].candidato;
       log(`Votação concluída: ${esc(eleito.nome)} recebeu ${votos[0].votos} votos e assumiu o acampamento.`, 'sistema');
      assumirMembroComunidade(eleito);
    }},
    { texto:'Recomeçar', fn:()=> location.reload() }]);
}

function assumirDescendente(id){
  const membro = S.familia.membros.find(m=>m.id === id && m.vivo && m.jogavel);
  if(!membro) return;
  assumirLider(membro);
}

function assumirLider(membro){
  sincronizarEstado();
  limparModais();
  const antigo = membroAtual();
  if(antigo){ antigo.vivo=false; antigo.diaSaida=S.dia; }
  S.sobreviventes = S.sobreviventes.filter(s=>s.id !== membro.id);
  S.familia.atual = membro.id;
  S.familia.liderança = null;
  S.player = {
    ...Object.fromEntries(SKILLS.map(k=>[k,membro[k] ?? 2])),
    nome:membro.nome,genero:membro.genero,idade:idadeMembro(membro),
    experiencia:membro.experiencia ?? 0,nivel:membro.nivel ?? 1,perks:[...(membro.perks || [])],
    moral:membro.moral ?? 70,especialidade:membro.especialidade,comportamento:{...membro.comportamento},
    imagem:membro.imagem || '',aparencia:membro.aparencia,
    passadoCriminoso:!!membro.passadoCriminoso,passadoRevelado:!!membro.passadoRevelado,
    arma:'Nenhuma',armaBonus:0,bonusLoot:0,vida:100,vidaMax:100,fome:15,sede:15,energia:100,emExcursao:false
  };
  // As relações são recalculadas para o novo líder; cada pessoa mantém seus próprios vínculos.
  for(const pessoa of S.sobreviventes) pessoa.relacao = {amizade:50,respeito:50,romance:pessoa.id === membro.parceiro ? 70 : 0};
  membro.vivo=true;
  S.vivo=true; S.acao=null;
  log(`${esc(membro.nome)} assumiu a liderança do acampamento.`,'sistema');
  construirAcoes(); iniciarLoop(); render(); salvarJogo();
}

function assumirMembroComunidade(sobrevivente){
  if(!sobrevivente?.vivo || idadeMembro(sobrevivente) < IDADE_ADULTA) return;
  assumirLider(sobrevivente);
}

function log(msg, tipo='info'){
  const box = document.getElementById('logBox');
  if(!box) return;

  const d = new Date();
  const hora = S ? formatarHora(S.tempoTotal) : '';

  const el = document.createElement('div');
  el.className = 'entrada ' + tipo;
  el.innerHTML = `<span class="hora">${hora}</span>${msg}`;
  box.appendChild(el);

  // Limita o tamanho do log
  while(box.children.length > 180) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

function formatarHora(t){
  const h = Math.floor((t % 1440)/60);
  const m = t % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function abrirInteracoes(i){
  const pessoa = S.sobreviventes[i];
  if(!pessoa || !pessoa.vivo) return;
  const rel = pessoa.relacao || (pessoa.relacao = {amizade:50,respeito:50,romance:0,status:'solteiro'}); rel.status ||= 'solteiro';
  const familia = pessoa.familiaId ? S.familia.membros.find(m=>m.id === pessoa.familiaId) : null;
  const parceiroValido = familia && !impedimentoBebe(familia);
  const opcoes = [
    {texto:'AMIGÁVEL · Conversar', fn:()=>iniciarInteracao(i,'conversar')},
    {texto:'AMIGÁVEL · Abraçar', fn:()=>iniciarInteracao(i,'abracar')},
    {texto:'AMIGÁVEL · Conversa profunda', fn:()=>iniciarInteracao(i,'profunda')},
    {texto:'ROTINA · Treinar junto', fn:()=>iniciarInteracao(i,'treinar')},
    {texto:'ROTINA · Passar um tempo juntos', fn:()=>iniciarInteracao(i,'divertir')}
  ];
  if(podeRomance(pessoa)){
    opcoes.push({texto:'ROMÂNTICA · Flertar',fn:()=>iniciarInteracao(i,'flertar')},{texto:'ROMÂNTICA · Beijar',fn:()=>iniciarInteracao(i,'beijar')},{texto:'ROMÂNTICA · Expressar amor',fn:()=>iniciarInteracao(i,'amor')});
    if(rel.amizade>=70 && rel.romance>=60)opcoes.push({texto:'COMPROMISSO · COMEÇAR a namorar',fn:()=>iniciarInteracao(i,'namorar')});
    if(rel.status==='namorando' && rel.amizade>=80 && rel.romance>=85)opcoes.push({texto:'COMPROMISSO · Pedir em casamento',fn:()=>iniciarInteracao(i,'casar')});
  }
  if(pessoa.ferido) opcoes.push({texto:'Ajudar o ferido',fn:()=>iniciarInteracao(i,'ajudar')});
  if(parceiroValido) opcoes.push({texto:'Tentar ter um bebê',fn:()=>iniciarInteracao(i,'bebe')});
  if(pessoa.doenca)opcoes.push({texto:'Tratar doença · 1 remédio · 1h',fn:()=>iniciarTratamento(pessoa.id)});
  opcoes.push({texto:'Escolher função',fn:()=>abrirFuncoes(i)});
  abrirPainel(`Conversar com ${esc(pessoa.nome)}`,`
    <div class="pessoaModal"><strong>${esc(pessoa.nome)}</strong><span class="pessoaMeta">${rotuloGenero(pessoa.genero)} · ${esc(pessoa.especialidade || 'Sobrevivente')} · Nível ${pessoa.nivel || 1}</span>
      ${barraRelacao('Amizade',rel.amizade)}${barraRelacao('Respeito',rel.respeito,'respeito')}${barraRelacao('Romance',rel.romance,'romance')}

    <p>Ânimo: <b>${Math.round(pessoa.moral ?? 70)}</b> · Função: <b>${ROTULOS_TAREFA[pessoa.tarefa]}</b><br>${situacaoNPC(pessoa)}</p>`,
    opcoes.concat([{texto:'Voltar ao grupo',fn:()=>abrirGrupo()}]));
}

function alternarRotina(i){ abrirFuncoes(i); }

function iniciarInteracao(i, tipo){
  if(!verificarEstado() || S.acao || S.pausado) return;
  const pessoa = S.sobreviventes[i];
  if(!pessoa || !pessoa.vivo) return;
  if(!naBase(pessoa)){log('Essa pessoa está fora da base. Espere ela voltar.','info');return;}
  if(tipo === 'bebe') return tentarBebeComPessoa(pessoa);
  const rel = pessoa.relacao || (pessoa.relacao = {amizade:50,respeito:50,romance:0,status:'solteiro'});
  const requisitos={abracar:[25,0],profunda:[45,0],flertar:[55,0],beijar:[65,35],amor:[70,60],namorar:[70,60],casar:[80,85]};
  if(requisitos[tipo] && (rel.amizade<requisitos[tipo][0] || rel.romance<requisitos[tipo][1])){log('A relação ainda não tem intimidade suficiente para essa interação.','info');return;}
  const duracoes = {conversar:20,abracar:10,profunda:30,flertar:20,beijar:15,amor:25,namorar:30,casar:40,treinar:60,divertir:40,ajudar:40};
  if(!duracoes[tipo]) return;
  if(tipo === 'treinar'){
    if(S.player.ultimoTreino === S.dia){ log('Você já treinou hoje. Descanse até amanhã.','info'); return; }
    if(!podeAgir(15)) return;
    S.player.energia -= 15; S.player.ultimoTreino = S.dia;
  }
  const nomes={abracar:'Abraçar',profunda:'Conversa profunda',flertar:'Flertar com',beijar:'Beijar',amor:'Expressar amor a',namorar:'COMEÇAR a namorar',casar:'Pedir em casamento'};
  S.acao = {tipo:'interacao', interacao:tipo, pessoaId:i, nome:`${nomes[tipo] || (tipo === 'treinar' ? 'Treinar com' : tipo === 'ajudar' ? 'Ajudar' : tipo === 'divertir' ? 'Passar tempo com' : 'Conversar com')} ${esc(pessoa.nome)}`, fim:S.tempoTotal+duracoes[tipo], dur:duracoes[tipo]};
  log(`Você começa a interagir com ${esc(pessoa.nome)}.`, 'info');
}

function resolverInteracao(a){
  const pessoa = S.sobreviventes[a.pessoaId];
  if(!pessoa || !pessoa.vivo) return;
  const rel = pessoa.relacao || (pessoa.relacao = {amizade:50,respeito:50,romance:0});
  if(a.interacao === 'conversar'){
    if(pessoa.tarefa === 'guarda' && Math.random() < 0.3){
      log(`${esc(pessoa.nome)} não quer conversar enquanto está de guarda.`, 'info');
      return;
    }
    rel.amizade += 4; rel.respeito += 1;
    if(rel.amizade >= 65 && podeRomance(pessoa)) rel.romance += 1;
    pessoa.moral = clamp((pessoa.moral ?? 70)+2,0,100); S.player.moral = clamp(S.player.moral+2,0,100);
    log(`${esc(pessoa.nome)} baixou a guarda e conversou com você.`, 'bom');
  } else if(a.interacao === 'treinar'){
    const skill = skillDaEspecialidade(pessoa.especialidade);
    rel.respeito += 5; rel.amizade += 2; ganharExperienciaPessoa(pessoa, 2);
    log(`Você treinou com ${esc(pessoa.nome)}. vocês ganharam experiencia em ${skill}.`, 'bom');
    ganharExperiencia(2);
  } else if(a.interacao === 'divertir'){
    rel.amizade += 5; rel.romance += rel.amizade >= 60 && podeRomance(pessoa) ? 3 : 0; pessoa.moral = clamp((pessoa.moral ?? 70)+8,0,100); S.player.moral = clamp(S.player.moral+6,0,100);
    log(`Você e ${esc(pessoa.nome)} conseguiram rir por alguns minutos.`, 'bom');
  } else if(['abracar','profunda','flertar','beijar','amor','namorar','casar'].includes(a.interacao)){
    const efeitos={abracar:[5,0],profunda:[8,0],flertar:[3,8],beijar:[2,12],amor:[4,15],namorar:[5,8],casar:[8,10]}[a.interacao];
    rel.amizade+=efeitos[0];rel.romance+=efeitos[1];
    if(a.interacao==='namorar')rel.status='namorando';
    if(a.interacao==='casar'){rel.status='casado';pessoa.parceiro=S.familia.atual;membroAtual().parceiro=pessoa.id;}
    log(`${esc(pessoa.nome)} correspondeu. A relação agora · ${rel.status==='casado'?'um casamento':rel.status==='namorando'?'um namoro':'mais próxima'}.`,'bom');
  } else if(a.interacao === 'ajudar'){
    pessoa.ferido = false; rel.amizade += 6; rel.respeito += 5; pessoa.moral = clamp((pessoa.moral ?? 70)+10,0,100);
    log(`Você cuidou dos ferimentos de ${esc(pessoa.nome)}. A confiança entre vocês aumentou.`, 'bom');
  }
  sincronizarEstado();
}

function skillDaEspecialidade(especialidade){
  if(/Médic|Organiz|Líder/.test(especialidade || '')) return 'inteligencia';
  if(/Caçador|Batedor|Scavenger/.test(especialidade || '')) return 'agilidade';
  if(/Mecân|Guarda|Veterano/.test(especialidade || '')) return 'forca';
  return 'resistencia';
}

function tentarBebeComPessoa(pessoa){
  const erro = impedimentoBebe(pessoa);
  if(erro){ log(erro,'info'); return; }
  if(!podeAgir(10)) return;
  S.player.energia -= 10;
  S.acao = {tipo:'bebe', pessoaId:pessoa.id, nome:'Cuidar da família',dur:360,fim:S.tempoTotal+360};
  log('Vocês reservam algumas horas para cuidar da família.','info');
}

function montarArvoreCompleta(){
  const grupos = {};
  S.familia.membros.filter(m=>m.parentesco!=='Comunidade').forEach(m=>{
    if(!grupos[m.geracao]) grupos[m.geracao] = [];
    grupos[m.geracao].push(m);
  });

  return Object.keys(grupos).sort((a,b)=>a-b).map(geracao=>{
    const membros = grupos[geracao].map(m=>{
      const classe = [m.id === S.familia.atual ? 'atual' : '', !m.vivo ? 'morto' : ''].join(' ');
      const parceiro = m.parceiro ? S.familia.membros.find(p=>p.id === m.parceiro) : null;
      const pais = m.pais.map(id=>S.familia.membros.find(p=>p.id === id)?.nome).filter(Boolean);
      const filhos = m.filhos.map(id=>S.familia.membros.find(f=>f.id === id)?.nome).filter(Boolean);
      const relacoes = [];
      if(pais.length) relacoes.push(`<b>Pais:</b> ${pais.map(esc).join(' e ')}`);
      if(parceiro) relacoes.push(`<b>Parceiro:</b> ${esc(parceiro.nome)}`);
      if(filhos.length) relacoes.push(`<b>Filhos:</b> ${filhos.map(esc).join(', ')}`);
      const marca = m.id === S.familia.atual ? '<small>Líder ATUAL</small>' : '';
      const skills = m.skills || m.stats || {};
      return `<div class="noFamilia ${classe}" role="button" tabindex="0" onclick="event.stopPropagation();abrirPerfilFamilia(${m.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();abrirPerfilFamilia(${m.id})}">
        <strong>${esc(m.nome)}</strong>
        <span>${esc(m.parentesco)} · ${idadeMembro(m)} anos</span>
         <span>${rotuloGenero(m.genero)} · ${esc(m.especialidade || 'Membro da família')}</span>
        <span>FOR ${skills.forca ?? 2} · AGI ${skills.agilidade ?? 2} · INT ${skills.inteligencia ?? 2} · CAR ${skills.carisma ?? 2} · RES ${skills.resistencia ?? 2}</span>
        ${marca}
        ${relacoes.length ? `<div class="familiaVinculo">${relacoes.join('<br>')}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="arvoreGeracao"><span class="geracaoNome">G${Number(geracao)+1}</span>${membros}</div>`;
  }).join('');
}

const SAVE_KEY = 'ultimos-dias-save-v1';

function statusSave(texto){
  for(const id of ['saveStatus','saveStatusAbertura']){
    const el = document.getElementById(id); if(el) el.textContent = texto;
  }
}

function snapshotJogo(){
  if(!S || S.combate || (S.vivo && (modalAtivo || filaModais.length))) return null;
  return JSON.stringify({versao:2,estado:S});
}

function salvarJogo(manual=false){
  const json = snapshotJogo();
  if(!json){ if(manual) statusSave('Conclua a decisão aberta antes de salvar.'); return false; }
  try{
    localStorage.setItem(SAVE_KEY,json);
    statusSave('Partida salva neste navegador.');
    document.getElementById('continuarSave').hidden=false;
    return true;
  }catch(e){ statusSave('Não foi possível salvar no navegador. Use Exportar partida.'); return false; }
}

function validarSave(dados){
  const e = dados?.estado;
  const numero = v=>typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 1000000000;
  const objeto = v=>v && typeof v === 'object' && !Array.isArray(v);
  const texto = v=>typeof v === 'string' && v.length <= 300;
  const imagemValida = v=>v == null || v === '' || (typeof v === 'string' && v.length <= 2100000 && /^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/=\s]+$/i.test(v));
  const comportamentoValido = v=>v == null || (objeto(v) && Object.values(v).every(numero));
  if(![1,2].includes(dados?.versao) || !e || typeof e.vivo !== 'boolean' || !numero(e.tempoTotal) || !Number.isInteger(e.dia) || e.dia < 1 || !numero(e.proxRefeicao)) throw Error('Formato de partida inválido.');
  if(!objeto(e.player) || !objeto(e.base) || !objeto(e.recursos) || !objeto(e.familia) || !Array.isArray(e.sobreviventes) || !Array.isArray(e.familia.membros)) throw Error('Partida incompleta.');
  if(dados.versao===1)migrarComunidade(e);
  e.recursos.eletricidade ??= 20;
  e.base.eletricidadeLigada ??= true;
  e.base.corteEletricoDia ??= null;
  e.base.aguaLigada ??= true;
  e.base.corteAguaDia ??= null;
  e.base.energiaCidadeRestaurada ??= false;
  e.base.aguaCidadeRestaurada ??= false;
  e.base.vagasVeiculo ??= LOCAIS_BASE[e.base.local]?.vagasVeiculo || 1;
  e.base.veiculos ??= [];
  e.base.proximoVeiculoId ??= 1;
  const tipoAntigo=v=>TIPOS_VEICULO[v.tipo]?v.tipo:(/caminhonete/i.test(v.nome||'')?'caminhonete':/van|suv/i.test(v.nome||'')?'suv':/2 portas|duas/i.test(v.nome||'')?'duasPortas':'quatroPortas');
  e.base.veiculos.forEach(v=>{
    if(!v || typeof v!=='object')return;
    const legado=!TIPOS_VEICULO[v.tipo];
    const chave=tipoAntigo(v),tipo=TIPOS_VEICULO[chave]||TIPOS_VEICULO.quatroPortas;
    v.tipo=chave;v.nome=tipo.nome;
    if(legado){v.capacidade=tipo.capacidade;v.combustivel=tipo.combustivel;v.carga=tipo.carga;v.velocidade=tipo.velocidade;}
    else{v.capacidade ||= tipo.capacidade;v.combustivel ??= tipo.combustivel;v.carga ??= tipo.carga;v.velocidade ??= tipo.velocidade;}
    v.customizacoes ??=[];v.estado ??='pronto';
  });
  e.base.ordemRadio ??= null;
  e.base.excursao ??= null;
  e.comunidade ??= {ultimoDiaDoenca:e.dia,ultimoEvento:e.tempoTotal};
  e.comunidade.resgateRadioUltimo ??= -99;
  e.comunidade.resgateRadioAlvo ??= null;
  e.comunidade.ultimoEventoRelacionamento ??= -99;
  validarComunidade(e);
  if(e.familia.membros.length > 10000 || !Number.isInteger(e.familia.proximoId)) throw Error('FAMÍLIA inválida.');
  const ids = new Set();
  for(const m of e.familia.membros){
    garantirInventario(m);
    if(!Number.isInteger(m.id) || m.id < 1 || ids.has(m.id) || typeof m.nome !== 'string' || typeof m.vivo !== 'boolean' || !numero(m.idade) || !numero(m.diaEntrada) || !Array.isArray(m.pais) || !Array.isArray(m.filhos) || !m.relacao || !Array.isArray(m.perks) || !numero(m.experiencia) || !numero(m.nivel) || !numero(m.moral) || !SKILLS.every(k=>numero(m[k]))) throw Error('Pessoa inválida na partida.');
    if(!texto(m.nome) || !texto(m.parentesco) || !texto(m.especialidade) || !['masculino','feminino'].includes(m.genero) || !Number.isInteger(m.geracao) || m.geracao < 0 || !numero(m.fertilidade) || (m.diaSaida != null && !numero(m.diaSaida)) || !objeto(m.relacao) || !['amizade','respeito','romance'].every(k=>numero(m.relacao[k])) || !m.perks.every(texto) || !imagemValida(m.imagem) || !comportamentoValido(m.comportamento)) throw Error('Dados pessoais inválidos.');
    ids.add(m.id);
  }
  if(!ids.has(e.familia.atual) || e.familia.proximoId <= Math.max(...ids)) throw Error('Liderança inválida.');
  if(e.sobreviventes.some(m=>!ids.has(m.id) || m.id === e.familia.atual) || new Set(e.sobreviventes.map(m=>m.id)).size !== e.sobreviventes.length) throw Error('Grupo inválido.');
  const pessoas=new Map(e.familia.membros.map(m=>[m.id,m]));
  const grupo=e.sobreviventes.map(m=>pessoas.get(m.id));
  if(grupo.some(m=>!Object.keys(FUNCOES_NPC).includes(m.tarefa)) || 1+grupo.filter(m=>m.vivo).length + (e.familia.gravidez ? 1 : 0) > capacidadeBase(e)) throw Error('Rotina ou capacidade inválida.');
  for(const m of e.familia.membros){
    if([...m.pais,...m.filhos].some(id=>!ids.has(id) || id === m.id) || (m.parceiro != null && (!ids.has(m.parceiro) || m.parceiro === m.id))) throw Error('Vínculo familiar inválido.');
    if(m.pais.some(id=>pessoas.get(id).geracao >= m.geracao || !pessoas.get(id).filhos.includes(m.id)) || m.filhos.some(id=>!pessoas.get(id).pais.includes(m.id))) throw Error('árvore genealógica inconsistente.');
  }
  garantirInventario(e.player);
  if(![...SKILLS,'vida','vidaMax','fome','sede','energia','moral','experiencia','nivel'].every(k=>numero(e.player[k])) || !Array.isArray(e.player.perks) || !e.player.comportamento || !Object.keys(NOMES_REC).every(k=>numero(e.recursos[k])) || !['barricadas','ameaca','moral'].every(k=>numero(e.base[k]))) throw Error('Atributos inválidos.');
  if(e.player.vidaMax <= 0 || !texto(e.player.nome) || !texto(e.player.especialidade) || !['Nenhuma','Revólver'].includes(e.player.arma) || !numero(e.player.armaBonus) || !numero(e.player.bonusLoot) || !e.player.perks.every(texto) || !imagemValida(e.player.imagem) || !comportamentoValido(e.player.comportamento)) throw Error('Protagonista inválido.');
  if(e.acao && (!['comer','beber','perto','expedicao','excursao','localizarVeiculo','customizarVeiculo','fortificar','cacar','descansar','dormir','procurar','familia','ajudar','interacao','bebe','gerador','radio','construir','demolir','procurarBase','mudarBase','planoMuro','tratarDoenca','restaurarServico'].includes(e.acao.tipo) || !numero(e.acao.fim) || !numero(e.acao.dur) || e.acao.dur === 0)) throw Error('Ação inválida.');
  if(e.acao && !texto(e.acao.nome)) throw Error('Descrição de aviso inválida.');
  if(e.acao?.tipo === 'interacao' && (!['conversar','abracar','profunda','flertar','beijar','amor','namorar','casar','treinar','divertir','ajudar'].includes(e.acao.interacao) || !Number.isInteger(e.acao.pessoaId) || !e.sobreviventes[e.acao.pessoaId])) throw Error('Interaviso inválida.');
  if(e.acao?.tipo === 'bebe' && !ids.has(e.acao.pessoaId)) throw Error('Parceiro inválido.');
  if(e.acao?.tipo === 'expedicao'){
    const local = LOCAIS.find(l=>l.id === e.acao.local?.id);
    if(!local) throw Error('Expedição inválida.'); e.acao.local=local;
  }
  const g = e.familia.gravidez;
  if(g && (!ids.has(g.maeId) || !ids.has(g.paiId) || !numero(g.inicio) || !numero(g.ultimoRisco))) throw Error('Gestação inválida.');
  return e;
}

function restaurarJogo(dados){
  const estado = validarSave(dados);
  // Reconecta os objetos compartilhados apts a leitura do JSON.
  estado.sobreviventes = estado.sobreviventes.map(s=>estado.familia.membros.find(m=>m.id === s.id));
  clearInterval(loopId); limparModais();
  S=estado; S.pausado=false;
  if(S.base?.excursao)tocarAudioExpedicao();
  else if(S.prologo?.concluido)tocarTemaJogo();
  document.getElementById('abertura').hidden=true;
  document.getElementById('criacao').hidden=true;
  document.getElementById('videoCriacaoFundo').hidden=true;
  document.getElementById('videoCriacao').pause();
  document.getElementById('jogo').hidden=false;
  document.getElementById('logBox').innerHTML='';
  construirAcoes();
  if(!S.vivo || S.player.vida <= 0){S.vivo=true;gameOver(S.motivoMorte || 'A liderança anterior chegou ao fim.');}
  else{iniciarLoop();render();log('Partida restaurada.','sistema');}
  salvarJogo();
}

function carregarJogo(){
  try{
    const json=localStorage.getItem(SAVE_KEY);
    if(!json) throw Error('Nenhuma partida salva neste navegador.');
    restaurarJogo(JSON.parse(json));
  }catch(e){statusSave('Não foi possível carregar a partida: '+e.message);}
}

function exportarJogo(){
  const json=snapshotJogo();
  if(!json){statusSave('Conclua a decisão aberta antes de exportar.');return;}
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='ultimos-dias-dia-'+S.dia+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  statusSave('Partida exportada para um arquivo JSON.');
}

async function importarJogo(evento){
  const arquivo=evento.target.files?.[0];
  if(!arquivo) return;
  try{
    statusSave('Lendo arquivo de partida…');
    if(arquivo.size > 8000000) throw Error('O arquivo excede 8 MB.');
    if(arquivo.size === 0) throw Error('O arquivo está vazio.');
    const dados=JSON.parse(await arquivo.text());
    validarSave(dados);
    if(S && !confirm('Substituir a partida atual pela partida do arquivo selecionado?')){ statusSave('Carregamento cancelado.'); return; }
    restaurarJogo(dados);
  }catch(e){statusSave('Não foi possível carregar: '+e.message);}
  finally{evento.target.value='';}
}

try{document.getElementById('continuarSave').hidden = !localStorage.getItem(SAVE_KEY);}catch(e){}
