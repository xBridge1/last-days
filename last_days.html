const SAVE_KEY = 'ultimos-dias-save-v1';

function statusSave(texto){
  for(const id of ['saveStatus','saveStatusAbertura']){
    const el = document.getElementById(id); if(el) el.textContent = texto;
  }
}

function snapshotJogo(){
  if(!S || (S.vivo && (modalAtivo || filaModais.length))) return null;
  return JSON.stringify({versao:2,estado:S});
}

function salvarJogo(manual=false){
  const json = snapshotJogo();
  if(!json){ if(manual) statusSave('Conclua a decisão aberta antes de salvar.'); return false; }
  try{
    localStorage.setItem(SAVE_KEY,json);
    statusSave('Partida salva neste navegador.');
    document.getElementById('continuarSave').hidden=false;
    return true;
  }catch(e){ statusSave('Não foi possível salvar no navegador. Use Exportar partida.'); return false; }
}

function validarSave(dados){
  const e = dados?.estado;
  const numero = v=>typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 1000000000;
  const objeto = v=>v && typeof v === 'object' && !Array.isArray(v);
  const texto = v=>typeof v === 'string' && v.length <= 300;
  const imagemValida = v=>v == null || v === '' || (typeof v === 'string' && v.length <= 2100000 && /^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/=\s]+$/i.test(v));
  const comportamentoValido = v=>v == null || (objeto(v) && Object.values(v).every(numero));
  if(![1,2].includes(dados?.versao) || !e || typeof e.vivo !== 'boolean' || !numero(e.tempoTotal) || !Number.isInteger(e.dia) || e.dia < 1 || !numero(e.proxRefeicao)) throw Error('Formato de partida inválido.');
  if(!objeto(e.player) || !objeto(e.base) || !objeto(e.recursos) || !objeto(e.familia) || !Array.isArray(e.sobreviventes) || !Array.isArray(e.familia.membros)) throw Error('Partida incompleta.');
  if(dados.versao===1)migrarComunidade(e);
  validarComunidade(e);
  if(e.familia.membros.length > 10000 || !Number.isInteger(e.familia.proximoId)) throw Error('Família inválida.');
  const ids = new Set();
  for(const m of e.familia.membros){
    if(!Number.isInteger(m.id) || m.id < 1 || ids.has(m.id) || typeof m.nome !== 'string' || typeof m.vivo !== 'boolean' || !numero(m.idade) || !numero(m.diaEntrada) || !Array.isArray(m.pais) || !Array.isArray(m.filhos) || !m.relacao || !Array.isArray(m.perks) || !numero(m.experiencia) || !numero(m.nivel) || !numero(m.moral) || !SKILLS.every(k=>numero(m[k]))) throw Error('Pessoa inválida na partida.');
    if(!texto(m.nome) || !texto(m.parentesco) || !texto(m.especialidade) || !['masculino','feminino'].includes(m.genero) || !Number.isInteger(m.geracao) || m.geracao < 0 || !numero(m.fertilidade) || (m.diaSaida != null && !numero(m.diaSaida)) || !objeto(m.relacao) || !['amizade','respeito','romance'].every(k=>numero(m.relacao[k])) || !m.perks.every(texto) || !imagemValida(m.imagem) || !comportamentoValido(m.comportamento)) throw Error('Dados pessoais inválidos.');
    ids.add(m.id);
  }
  if(!ids.has(e.familia.atual) || e.familia.proximoId <= Math.max(...ids)) throw Error('Liderança inválida.');
  if(e.sobreviventes.some(m=>!ids.has(m.id) || m.id === e.familia.atual) || new Set(e.sobreviventes.map(m=>m.id)).size !== e.sobreviventes.length) throw Error('Grupo inválido.');
  const pessoas=new Map(e.familia.membros.map(m=>[m.id,m]));
  const grupo=e.sobreviventes.map(m=>pessoas.get(m.id));
  if(grupo.some(m=>!Object.keys(FUNCOES_NPC).includes(m.tarefa)) || 1+grupo.filter(m=>m.vivo).length + (e.familia.gravidez ? 1 : 0) > capacidadeBase(e)) throw Error('Rotina ou capacidade inválida.');
  for(const m of e.familia.membros){
    if([...m.pais,...m.filhos].some(id=>!ids.has(id) || id === m.id) || (m.parceiro != null && (!ids.has(m.parceiro) || m.parceiro === m.id))) throw Error('Vínculo familiar inválido.');
    if(m.pais.some(id=>pessoas.get(id).geracao >= m.geracao || !pessoas.get(id).filhos.includes(m.id)) || m.filhos.some(id=>!pessoas.get(id).pais.includes(m.id))) throw Error('Árvore genealógica inconsistente.');
  }
  if(![...SKILLS,'vida','vidaMax','fome','sede','energia','moral','experiencia','nivel'].every(k=>numero(e.player[k])) || !Array.isArray(e.player.perks) || !e.player.comportamento || !Object.keys(NOMES_REC).every(k=>numero(e.recursos[k])) || !['barricadas','ameaca','moral'].every(k=>numero(e.base[k]))) throw Error('Atributos inválidos.');
  if(e.player.vidaMax <= 0 || !texto(e.player.nome) || !texto(e.player.especialidade) || !['Nenhuma','Revólver'].includes(e.player.arma) || !numero(e.player.armaBonus) || !numero(e.player.bonusLoot) || !e.player.perks.every(texto) || !imagemValida(e.player.imagem) || !comportamentoValido(e.player.comportamento)) throw Error('Protagonista inválido.');
  if(e.acao && (!['comer','beber','perto','expedicao','fortificar','cacar','descansar','procurar','familia','ajudar','interacao','bebe','gerador','construir','demolir','procurarBase','mudarBase','planoMuro','tratarDoenca'].includes(e.acao.tipo) || !numero(e.acao.fim) || !numero(e.acao.dur) || e.acao.dur === 0)) throw Error('Ação inválida.');
  if(e.acao && !texto(e.acao.nome)) throw Error('Descrição de ação inválida.');
  if(e.acao?.tipo === 'interacao' && (!['conversar','treinar','divertir','ajudar'].includes(e.acao.interacao) || !Number.isInteger(e.acao.pessoaId) || !e.sobreviventes[e.acao.pessoaId])) throw Error('Interação inválida.');
  if(e.acao?.tipo === 'bebe' && !ids.has(e.acao.pessoaId)) throw Error('Parceiro inválido.');
  if(e.acao?.tipo === 'expedicao'){
    const local = LOCAIS.find(l=>l.id === e.acao.local?.id);
    if(!local) throw Error('Expedição inválida.'); e.acao.local=local;
  }
  const g = e.familia.gravidez;
  if(g && (!ids.has(g.maeId) || !ids.has(g.paiId) || !numero(g.inicio) || !numero(g.ultimoRisco))) throw Error('Gestação inválida.');
  return e;
}

function restaurarJogo(dados){
  const estado = validarSave(dados);
  // Reconecta os objetos compartilhados após a leitura do JSON.
  estado.sobreviventes = estado.sobreviventes.map(s=>estado.familia.membros.find(m=>m.id === s.id));
  clearInterval(loopId); limparModais();
  S=estado; S.pausado=false;
  document.getElementById('abertura').hidden=true;
  document.getElementById('criacao').hidden=true;
  document.getElementById('videoCriacaoFundo').hidden=true;
  document.getElementById('videoCriacao').pause();
  document.getElementById('jogo').hidden=false;
  document.getElementById('logBox').innerHTML='';
  construirAcoes();
  if(!S.vivo || S.player.vida <= 0){S.vivo=true;gameOver(S.motivoMorte || 'A liderança anterior chegou ao fim.');}
  else{iniciarLoop();render();log('Partida restaurada.','sistema');}
  salvarJogo();
}

function carregarJogo(){
  try{
    const json=localStorage.getItem(SAVE_KEY);
    if(!json) throw Error('Nenhuma partida salva neste navegador.');
    restaurarJogo(JSON.parse(json));
  }catch(e){statusSave('Não foi possível carregar a partida: '+e.message);}
}

function exportarJogo(){
  const json=snapshotJogo();
  if(!json){statusSave('Conclua a decisão aberta antes de exportar.');return;}
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='ultimos-dias-dia-'+S.dia+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  statusSave('Partida exportada para um arquivo JSON.');
}

async function importarJogo(evento){
  const arquivo=evento.target.files?.[0];
  if(!arquivo) return;
  try{
    if(arquivo.size > 8000000) throw Error('O arquivo excede 8 MB.');
    const dados=JSON.parse(await arquivo.text());
    validarSave(dados);
    if(S && !confirm('Substituir a partida atual pela partida do arquivo selecionado?')) return;
    restaurarJogo(dados);
  }catch(e){statusSave('Não foi possível carregar: '+e.message);}
  finally{evento.target.value='';}
}

try{document.getElementById('continuarSave').hidden = !localStorage.getItem(SAVE_KEY);}catch(e){}

const videoCriacaoInicial = document.getElementById('videoCriacao');
videoCriacaoInicial.volume = 0.5;
videoCriacaoInicial.muted = true;
videoCriacaoInicial.play().catch(()=>{});
renderCriacao();
</script>
